<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CalcSuite">
  <title>CalcSuite</title>
  <desc>Maskable variant of the CalcSuite mark: a calculator outline that breaks into two opposing arrows around the four arithmetic operators.</desc>
  <defs>
    <linearGradient id="cs-mask-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6cff"/>
      <stop offset="52%" stop-color="#2f9dfb"/>
      <stop offset="100%" stop-color="#2ee6c5"/>
    </linearGradient>
  </defs>

  <!--
    Maskable variant. The platform may crop this to a circle or squircle, so the
    background bleeds to every edge (no rounded tile, no transparent margin) and
    the mark sits inside the safe zone — a circle of radius 40% of the icon.
    Net scale is 0.8 of the favicon's 1.12, i.e. 0.9 of the base geometry.
  -->
  <rect x="0" y="0" width="64" height="64" fill="url(#cs-mask-grad)"/>

  <g transform="translate(32 32) scale(.9) translate(-32 -32)">
    <!-- Loop: calculator body + conversion cycle -->
    <g fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="butt">
      <path d="M14 27.1 V24.5 A9.5 9.5 0 0 1 23.5 15 H40.5 A9.5 9.5 0 0 1 50 24.5 V29.6"/>
      <path d="M50 37.1 V39.5 A9.5 9.5 0 0 1 40.5 49 H23.5 A9.5 9.5 0 0 1 14 39.5 V34.6"/>
    </g>
    <g fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
      <path d="M14 28.4 9.4 35 18.6 35Z"/>
      <path d="M50 35.8 54.6 29.2 45.4 29.2Z"/>
    </g>
    <!-- Operator keys, 2x2 -->
    <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" fill="none">
      <path d="M20.3 25.5H28.7"/>
      <path d="M24.5 21.3V29.7"/>
      <path d="M35.3 25.5H43.7"/>
      <path d="M21.4 36.4 27.6 42.6"/>
      <path d="M27.6 36.4 21.4 42.6"/>
      <path d="M35.4 36.6H43.6"/>
      <path d="M35.4 42.4H43.6"/>
    </g>
  </g>
</svg>
