<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CalcSuite – Every calculator and converter you need, in one modern place. 50+ unified, live, bidirectional tools built with vanilla JavaScript.">
<meta name="theme-color" content="#0b0d13">
<title>CalcSuite – Every Calculator & Converter You Need</title>

<link rel="icon" href="Assets/Favicon/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/themes.css">

<script>
  /* Apply the stored theme before first paint (no flash of wrong theme). */
  (function () {
    try {
      var stored = JSON.parse(localStorage.getItem('calcsuite:theme'));
      var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (stored === 'light' || stored === 'dark') ? stored : (sysDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a class="brand" href="#/" aria-label="CalcSuite home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="31" height="31" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7c6cff"></stop>
              <stop offset="52%" stop-color="#2f9dfb"></stop>
              <stop offset="100%" stop-color="#2ee6c5"></stop>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg-grad)"></rect>
          <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
            <!-- Calculator body drawn as a broken loop: also reads as a convert cycle -->
            <g fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="butt">
              <path d="M14 27.1 V24.5 A9.5 9.5 0 0 1 23.5 15 H40.5 A9.5 9.5 0 0 1 50 24.5 V29.6"></path>
              <path d="M50 37.1 V39.5 A9.5 9.5 0 0 1 40.5 49 H23.5 A9.5 9.5 0 0 1 14 39.5 V34.6"></path>
            </g>
            <g fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round">
              <path d="M14 28.4 9.4 35 18.6 35Z"></path>
              <path d="M50 35.8 54.6 29.2 45.4 29.2Z"></path>
            </g>
            <!-- Operator keys -->
            <g stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" fill="none">
              <path d="M20.3 25.5H28.7"></path><path d="M24.5 21.3V29.7"></path>
              <path d="M35.3 25.5H43.7"></path>
              <path d="M21.4 36.4 27.6 42.6"></path><path d="M27.6 36.4 21.4 42.6"></path>
              <path d="M35.4 36.6H43.6"></path><path d="M35.4 42.4H43.6"></path>
            </g>
          </g>
        </svg>
      </span>
      <span class="brand-text">Calc<span class="brand-accent">Suite</span></span>
    </a>

    <button class="icon-btn nav-toggle" id="nav-toggle" type="button"
            aria-label="Open menu" aria-expanded="false" aria-controls="nav-panel">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <div class="header-panel" id="nav-panel">
      <nav class="main-nav" id="main-nav" aria-label="Primary">
        <a href="#/" data-nav="#/"><i class="fa-solid fa-house nav-icon" aria-hidden="true"></i>Home</a>
        <a href="#/calculators" data-nav="#/calculators"><i class="fa-solid fa-calculator nav-icon" aria-hidden="true"></i>Calculators</a>
        <a href="#/converters" data-nav="#/converters"><i class="fa-solid fa-right-left nav-icon" aria-hidden="true"></i>Converters</a>
        <a href="#/favorites" data-nav="#/favorites"><i class="fa-solid fa-star nav-icon" aria-hidden="true"></i>Favorites</a>
        <a href="#/history" data-nav="#/history"><i class="fa-solid fa-clock-rotate-left nav-icon" aria-hidden="true"></i>History</a>
      </nav>

      <div class="search-wrap" role="search">
        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
        <input type="search" id="global-search" class="search-input" placeholder="Search tools…"
               autocomplete="off" aria-label="Search calculators and converters"
               aria-expanded="false" aria-controls="search-results">
        <kbd class="search-kbd">/</kbd>
        <div class="search-dropdown" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="header-actions">
        <button class="icon-btn action-btn" id="theme-toggle" type="button" aria-label="Toggle dark and light theme" title="Toggle theme">
          <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
          <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
          <span class="action-label">Theme</span>
        </button>

        <a class="icon-btn action-btn" id="github-link" href="https://github.com/TajkirHossen-14/CalcSuite"
           target="_blank" rel="noopener noreferrer" title="View the developer on GitHub" aria-label="GitHub profile">
          <i class="fa-brands fa-github" aria-hidden="true"></i>
          <span class="action-label">GitHub</span>
        </a>
      </div>
    </div>
  </div>
  <div class="route-progress" id="route-progress" aria-hidden="true"></div>
</header>

<main id="main-content" tabindex="-1"></main>

      <p>Every calculator and converter you need, in one modern place.</p>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="#/calculators">All Calculators</a>
      <a href="#/converters">All Converters</a>
      <a href="#/favorites">Favorites</a>

      <a href="#/about">About</a>
      <a href="#/faq">FAQ</a>
      <a href="https://github.com/TajkirHossen-14/CalcSuite" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-github" aria-hidden="true"></i> GitHub
      </a>
    </nav>
    <p class="footer-note">© 2026 CalcSuite. All Rights Reserved</p>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
